<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gravity Explorer: Calcola il tuo peso e salto su altri pianeti con dati NASA.">
    <!-- CSP per sicurezza: blocca script inline non autorizzati e risorse esterne non necessarie -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
    <title>Gravity Explorer | Cyber-NASA Edition</title>
    
    <!-- Font Futuristico -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Cyber-NASA Palette */
            --bg-deep: #05070a;
            --bg-panel: #0b0f19;
            --neon-cyan: #00f3ff;
            --neon-blue: #0066ff;
            --neon-purple: #b026ff;
            --text-main: #e0e6ed;
            --text-dim: #8b9bb4;
            --border-glow: rgba(0, 243, 255, 0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --card-radius: 12px;
            --transition-speed: 0.3s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 102, 255, 0.15) 0%, transparent 60%),
                linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        /* Scanline Effect */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Input Section */
        .input-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: var(--card-radius);
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto 3rem auto;
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .input-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--neon-blue);
            border-radius: 6px;
            padding: 1rem;
            color: var(--text-main);
            font-family: var(--font-display);
            font-size: 1.5rem;
            outline: none;
            transition: all var(--transition-speed);
        }

        input[type="number"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Remove spinner arrows */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-calculate {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 6px;
            padding: 1rem 2rem;
            color: #fff;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all var(--transition-speed);
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 102, 255, 0.5);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        .btn-calculate::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            opacity: 0;
        }

        .btn-calculate:hover::after {
            opacity: 1;
            left: 100%;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            min-height: 1.2em;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .results-grid.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .planet-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-speed);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .planet-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            transform: translateY(-5px);
        }

        .planet-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 60px; height: 60px;
            background: radial-gradient(circle at top right, var(--neon-cyan), transparent 70%);
            opacity: 0.1;
        }

        .planet-name {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.8rem;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-unit {
            font-size: 0.8rem;
            color: var(--neon-blue);
            margin-left: 4px;
        }

        .fact-box {
            background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--neon-purple);
            padding: 0.8rem;
            margin-top: 1rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-dim);
        }

        .fact-box strong {
            color: var(--neon-cyan);
        }

        @keyframes cardEnter {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Footer */
        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .input-panel { padding: 1.5rem; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gravity Explorer</h1>
            <p class="subtitle">Simulatore Gravitazionale Interplanetario</p>
        </header>

        <main>
            <section class="input-panel">
                <div class="input-group">
                    <label for="weightInput">Inserisci il tuo peso sulla Terra</label>
                    <input type="number" id="weightInput" placeholder="Es. 75" min="1" max="500" step="0.1" aria-label="Peso in kg">
                    <div id="errorMsg" class="error-msg" aria-live="polite"></div>
                    <button id="calcBtn" class="btn-calculate">Calcola Dati</button>
                </div>
            </section>

            <section id="resultsGrid" class="results-grid" aria-live="polite">
                <!-- Cards generated by JS -->
            </section>
        </main>

        <footer>
            <p>Dati gravitazionali basati su NASA Fact Sheets. Progetto per GitHub Pages.</p>
        </footer>
    </div>

    <script>
        /**
         * Gravity Explorer - Core Logic
         * @version 1.0.0
         * @author EriK 3.8.6 Max Preview
         */
        (function() {
            'use strict';

            // NASA Gravity Constants (Surface gravity in m/s^2)
            // Source: NASA Planetary Fact Sheet
            const GRAVITY_DATA = Object.freeze({
                earth: { g: 9.807, name: 'Terra', fact: 'La gravità terrestre è lo standard di riferimento (1g). Mantiene la nostra atmosfera e gli oceani al loro posto.' },
                moon:  { g: 1.62,  name: 'Luna',  fact: 'La Luna ha solo il 16.6% della gravità terrestre. Gli astronauti Apollo potevano saltare facilmente nonostante le tute pesanti.' },
                mars:  { g: 3.72,  name: 'Marte', fact: 'Marte ha circa il 38% della gravità terrestre. Un salto qui ti farebbe sentire come un supereroe, ma attento all\'atterraggio!' },
                jupiter: { g: 24.79, name: 'Giove', fact: 'Giove è un gigante gassoso. La sua gravità è 2.5 volte quella terrestre. Camminare sarebbe impossibile, verresti schiacciato dal tuo stesso peso.' },
                saturn: { g: 10.44, name: 'Saturno', fact: 'Nonostante le sue dimensioni enormi, Saturno ha una densità bassa. La sua gravità superficiale è solo leggermente superiore a quella terrestre.' },
                pluto: { g: 0.62, name: 'Plutone', fact: 'Plutone è piccolo e lontano. La sua gravità è debolissima (6% della Terra). Potresti lanciare una palla da baseball in orbita!' }
            });

            const EARTH_JUMP_HEIGHT_CM = 50; // Base jump height on Earth

            // DOM Elements
            const els = {
                input: document.getElementById('weightInput'),
                btn: document.getElementById('calcBtn'),
                error: document.getElementById('errorMsg'),
                grid: document.getElementById('resultsGrid')
            };

            /**
             * Validates user input.
             * @param {string} val - Raw input value.
             * @returns {number|null} - Parsed valid number or null.
             */
            function validateInput(val) {
                const num = parseFloat(val);
                if (isNaN(num)) return null;
                if (num <= 0) return null;
                if (num > 1000) return null; // Sanity check
                return num;
            }

            /**
             * Calculates weight and jump height for a planet.
             * @param {number} massKg - User mass in kg.
             * @param {number} planetG - Planet gravity m/s^2.
             * @returns {{weightKg: number, weightN: number, jumpCm: number}}
             */
            function calculatePhysics(massKg, planetG) {
                const earthG = GRAVITY_DATA.earth.g;
                
                // Weight in kg-equivalent (what a scale would show)
                const weightKg = massKg * (planetG / earthG);
                
                // Weight in Newtons (Force)
                const weightN = massKg * planetG;
                
                // Jump height: inversely proportional to gravity
                // h_planet = h_earth * (g_earth / g_planet)
                const jumpCm = EARTH_JUMP_HEIGHT_CM * (earthG / planetG);

                return {
                    weightKg: Math.round(weightKg * 100) / 100,
                    weightN: Math.round(weightN * 100) / 100,
                    jumpCm: Math.round(jumpCm * 100) / 100
                };
            }

            /**
             * Creates a Planet Card DOM element.
             * @param {string} key - Planet key.
             * @param {object} data - Planet data.
             * @param {object} physics - Calculated physics.
             * @param {number} delay - Animation delay in ms.
             * @returns {HTMLElement}
             */
            function createCard(key, data, physics, delay) {
                const card = document.createElement('article');
                card.className = 'planet-card';
                card.style.animationDelay = `${delay}ms`;
                
                // Use textContent for security (XSS prevention)
                card.innerHTML = `
                    <h2 class="planet-name"></h2>
                    <div class="stat-row">
                        <span class="stat-label">Peso Equivalente</span>
                        <span class="stat-value"><span class="val-kg"></span><span class="stat-unit">kg</span></span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Forza Peso</span>
                        <span class="stat-value"><span class="val-n"></span><span class="stat-unit">N</span></span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Altezza Salto</span>
                        <span class="stat-value"><span class="val-jump"></span><span class="stat-unit">cm</span></span>
                    </div>
                    <div class="fact-box">
                        <strong>LO SAPEVI?</strong> <span class="fact-text"></span>
                    </div>
                `;

                // Populate safely
                card.querySelector('.planet-name').textContent = data.name;
                card.querySelector('.val-kg').textContent = physics.weightKg.toFixed(2);
                card.querySelector('.val-n').textContent = physics.weightN.toFixed(2);
                card.querySelector('.val-jump').textContent = physics.jumpCm.toFixed(1);
                card.querySelector('.fact-text').textContent = data.fact;

                return card;
            }

            /**
             * Main calculation and render handler.
             */
            function handleCalculate() {
                const rawVal = els.input.value.trim();
                const mass = validateInput(rawVal);

                // Reset UI
                els.error.textContent = '';
                els.grid.innerHTML = '';
                els.grid.classList.remove('visible');

                if (!mass) {
                    els.error.textContent = '⚠️ Inserisci un peso valido (es. 70.5). Max 1000 kg.';
                    els.input.focus();
                    return;
                }

                // Use DocumentFragment for batch DOM insertion (Performance)
                const fragment = document.createDocumentFragment();
                const planets = ['moon', 'mars', 'jupiter', 'saturn', 'pluto'];
                let delay = 0;

                planets.forEach(key => {
                    const pData = GRAVITY_DATA[key];
                    const physics = calculatePhysics(mass, pData.g);
                    const card = createCard(key, pData, physics, delay);
                    fragment.appendChild(card);
                    delay += 100; // Stagger animation
                });

                els.grid.appendChild(fragment);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    els.grid.classList.add('visible');
                });
            }

            // Event Listeners
            els.btn.addEventListener('click', handleCalculate);
            
            // Allow Enter key to submit
            els.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleCalculate();
                }
            });

            // Input sanitization on type (allow only numbers and dot)
            els.input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9.]/g, '');
            });

        })();
    </script>
</body>
</html>
